  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ont-weight:600;\n    letter-spacing:-0.02em;\n    line-height:1.0;\n    text-wrap:balance;\n  }\n  /* Secondary display: Ambroise Francois \u2014 uppercase, dramatic */\n  .h-secondary{\n    font-family:'Ambroise Francois','Bodoni Moda',serif;\n    font-weight:900;\n    font-style:normal;\n    letter-spacing:0.005em;\n    line-height:0.92;\n    text-transform:uppercase;\n    text-wrap:balance;\n    font-stretch:condensed;\n  }\n  .eyebrow{\n    font-family:'Elza','Inter',sans-serif;\n    font-weight:700;\n    font-size:11px;\n    letter-spacing:0.24em;\n    text-transform:uppercase;\n  }\n  .mono{font-family:'JetBrains Mono',monospace}\n\n  /* \u2014\u2014\u2014\u2014\u2014 LAYOUT \u2014\u2014\u2014\u2014\u2014 */\n  .wrap{max-width:1280px;margin:0 auto;padding:0 32px}\n  .wrap-narrow{max-width:1000px;margin:0 auto;padding:0 32px}\n  section{position:relative}\n  .section-pad{padding:128px 0}\n\n  /* \u2014\u2014\u2014\u2014\u2014 BUTTONS \u2014\u2014\u2014\u2014\u2014 */\n  .btn{\n    display:inline-flex;align-items:center;gap:10px;\n    padding:18px 26px;\n    background:var(--lightning);\n    color:var(--black-wash);\n    text-decoration:none;\n    font-family:'Elza','Inter',sans-serif;\n    font-weight:700;\n    font-size:13px;\n    letter-spacing:0.16em;\n    text-transform:uppercase;\n    border:none;cursor:pointer;\n    transition:transform .15s ease, box-shadow .15s ease;\n    box-shadow:0 0 0 0 var(--lightning);\n  }\n  .btn:hover{\n    transform:translate(-2px,-2px);\n    box-shadow:6px 6px 0 0 var(--black-wash), 6px 6px 0 1px var(--lightning);\n  }\n  .btn .arr{transition:transform .2s ease}\n  .btn:hover .arr{transform:translateX(4px)}\n  .btn-ghost{\n    background:transparent;color:var(--powder);\n    border:1px solid var(--powder-line-strong);\n  }\n  .btn-ghost:hover{background:rgba(255,255,255,.04);box-shadow:none;transform:none}\n  .btn-hepatica{\n    background:var(--hepatica);color:var(--powder);\n  }\n  .btn-hepatica:hover{\n    box-shadow:6px 6px 0 0 var(--black-wash), 6px 6px 0 1px var(--hepatica);\n  }\n  .btn-lg{padding:22px 32px;font-size:14px}\n\n  /* \u2014\u2014\u2014\u2014\u2014 STICKY NAV \u2014\u2014\u2014\u2014\u2014 */\n  .nav{\n    position:fixed;top:0;left:0;right:0;z-index:50;\n    background:rgba(13,12,12,0.85);\n    backdrop-filter:blur(14px);\n    border-bottom:1px solid var(--powder-line);\n    transform:translateY(-110%);\n    transition:transform .35s ease;\n  }\n  .nav.show{transform:translateY(0)}\n  .nav-inner{\n    max-width:1280px;margin:0 auto;padding:14px 32px;\n    display:flex;align-items:center;justify-content:space-between;gap:16px;\n  }\n  .logo{\n    font-family:'Elza','Inter',sans-serif;\n    font-weight:900;\n    font-size:20px;letter-spacing:0.01em;\n    color:var(--powder);\n    text-decoration:none;\n    display:inline-flex;align-items:baseline;\n  }\n  .logo .i{\n    color:var(--lightning);position:relative;\n    display:inline-block;\n    text-shadow:0 0 14px rgba(252,255,2,0.55);\n  }\n  .logo .i::after{\n    content:\"\";position:absolute;left:50%;top:100%;transform:translateX(-50%);\n    width:14px;height:18px;\n    background:linear-gradient(180deg,rgba(252,255,2,0.55),rgba(252,255,2,0));\n    clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);\n    pointer-events:none;\n  }\n  .nav-links{display:flex;gap:24px;align-items:center}\n  .nav-links a{\n    color:var(--powder-dim);text-decoration:none;\n    font-size:12px;font-weight:600;letter-spacing:0.08em;\n    text-transform:uppercase;\n    transition:color .15s ease;\n  }\n  .nav-links a:hover{color:var(--powder)}\n  .nav-links a.btn,.nav-links a.btn:hover{color:var(--black-wash)}\n  .nav .btn{padding:12px 18px;font-size:11px}\n  @media(max-width:820px){.nav-links a:not(.btn){display:none}}\n\n  /* \u2014\u2014\u2014\u2014\u2014 SPOTLIGHT MOTIFS \u2014\u2014\u2014\u2014\u2014 */\n  /* Vertical yellow bars pattern (drawn from brand graphic) */\n  .spotlight-bars{\n    position:absolute;inset:0;pointer-events:none;\n    background-image:\n      repeating-linear-gradient(\n        90deg,\n        var(--lightning) 0,\n        var(--lightning) 6px,\n        transparent 6px,\n        transparent 22px\n      );\n    mask-image:\n      radial-gradient(ellipse at 50% 30%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.6) 35%, rgba(0,0,0,0) 70%),\n      linear-gradient(180deg, rgba(0,0,0,0.0) 0%, rgba(0,0,0,1) 18%, rgba(0,0,0,1) 80%, rgba(0,0,0,0.0) 100%);\n    mask-composite:intersect;\n    -webkit-mask-image:\n      radial-gradient(ellipse at 50% 30%, rgba(0,0,0,1) 0%, rgba(0,0,0,0.6) 35%, rgba(0,0,0,0) 70%),\n      linear-gradient(180deg, rgba(0,0,0,0.0) 0%, rgba(0,0,0,1) 18%, rgba(0,0,0,1) 80%, rgba(0,0,0,0.0) 100%);\n    -webkit-mask-composite:source-in;\n    opacity:.55;\n    filter:drop-shadow(0 0 8px rgba(252,255,2,0.4));\n  }\n  /* Spotlight beam \u2014 triangular cone with ground glow */\n  .beam{\n    position:absolute;left:50%;transform:translateX(-50%);\n    width:560px;height:520px;\n    pointer-events:none;\n    z-index:0;\n  }\n  .beam .cone{\n    position:absolute;left:50%;top:0;transform:translateX(-50%);\n    width:100%;height:70%;\n    background:radial-gradient(ellipse 70% 100% at 50% 0%,\n      rgba(255,255,255,0.10) 0%,\n      rgba(255,255,255,0.04) 35%,\n      rgba(255,255,255,0.01) 60%,\n      transparent 75%);\n    clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);\n    filter:blur(1px);\n  }\n  .beam .ground{\n    position:absolute;left:50%;bottom:0;transform:translateX(-50%);\n    width:130%;height:110px;\n    background:radial-gradient(ellipse at center top,\n      rgba(255,255,255,0.30) 0%,\n      rgba(255,255,255,0.10) 30%,\n      rgba(255,255,255,0.02) 55%,\n      transparent 75%);\n    filter:blur(2px);\n  }\n\n  /* \u2014\u2014\u2014\u2014\u2014 HERO \u2014\u2014\u2014\u2014\u2014 */\n  .hero{\n    min-height:100vh;\n    padding:160px 0 100px;\n    display:flex;flex-direction:column;justify-content:center;\n    position:relative;overflow:hidden;\n  }\n  .hero .beam{top m);\n  }\n  .audience-strip b{color:var(--lightning);font-weight:700}\n  .audience-strip .sep{color:var(--powder-faint)}\n\n  /* \u2014\u2014\u2014\u2014\u2014 Generic section header \u2014\u2014\u2014\u2014\u2014 */\n  .lead-row{\n    display:grid;grid-template-columns:1fr 380px;gap:64px;\n    align-items:flex-end;\n    margin-bottom:80px;\n  }\n  .lead-row .num{\n    font-family:'JetBrains Mono',monospace;\n    font-size:12px;color:var(--lightning);\n    letter-spacing:0.18em;\n    margin-bottom:24px;\n  }\n  .lead-row h2{\n    font-size:clamp(40px,5.6vw,84px);margin:0;\n    max-width:18ch;\n  }\n  .lead-row .right{color:var(--powder-dim);font-size:17px;line-height:1.55}\n  @media(max-width:880px){.lead-row{grid-template-columns:1fr}}\n\n  .rule{height:1px;background:var(--powder-line);width:100%;margin:0}\n\n  /* \u2014\u2014\u2014\u2014\u2014 Section 2: Problem \u2014\u2014\u2014\u2014\u2014 */\n  .problem-body{\n    max-width:780px;\n    font-size:24px;line-height:1.45;\n    color:var(--powder);\n    font-weight:400;\n  }\n  .problem-body p{margin:0 0 28px}\n  .problem-body em{font-style:italic;color:var(--lightning);font-weight:500}\n\n  .problem-grid{\n    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;\n    background:var(--powder-line);\n    border-top:1px solid var(--powder-line);\n    border-bottom:1px solid var(--powder-line);\n    margin-top:96px;\n  }\n  .problem-grid > div{\n    background:var(--black-wash);\n    padding:56px 36px;\n    display:flex;flex-direction:column;gap:18px;\n  }\n  .problem-grid .tier{\n    font-family:'JetBrains Mono',monospace;\n    font-size:10px;letter-spacing:0.18em;text-transform:uppercase;\n    color:var(--lightning);\n    display:flex;align-items:center;gap:10px;\n  }\n  .problem-grid .tier .bar{width:24px;height:1px;background:var(--lightning)}\n  .problem-grid h4{\n    font-family:'Elza','Inter',sans-serif;\n    font-weight:600;font-size:28px;line-height:1.05;\n    margin:0;letter-spacing:-0.015em;\n  }\n  .problem-grid p{margin:0;color:var(--powder-dim);font-size:15px;line-height:1.55}\n  @media(max-width:820px){.problem-grid{grid-template-columns:1fr}}\n\n  /* \u2014\u2014\u2014\u2014\u2014 Section 3: 5 P's framework \u2014\u2014\u2014\u2014\u2014 */\n  .framework{\n    background:var(--black-wash);\n    background-image:\n      radial-gradient(circle at 80% 10%, rgba(252,255,2,0.05), transparent 50%),\n      radial-gradient(circle at 10% 90%, rgba(102,94,243,0.06), transparent 50%);\n    border-top:1px solid var(--powder-line);\n    border-bottom:1px solid var(--powder-line);\n  }\n  .journey{\n    margin-top:48px;\n    display:flex;align-items:center;gap:16px;flex-wrap:wrap;\n    font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;\n    text-transform:uppercase;color:var(--powder-faint);\n    margin-bottom:48px;\n  }\n  .journey .pill{\n    padding:6px 14px;border:1px solid var(--powder-line-strong);\n    color:var(--powder-dim);\n  }\n  .journey .arr{color:var(--lightning)}\n\n  .pees{\n    margin-top:32px;\n    display:flex;flex-direction:column;gap:0;\n  }\n  .p-row{\n    display:grid;grid-template-columns:120px 1fr 1.4fr;\n    gap:48px;\n    padding:48px 0;\n    border-top:1px solid var(--powder-line);\n    align-items:start;\n  }\n  .p-row:last-child{border-bottom:1px solid var(--powder-line)}\n  .p-num{\n    font-family:'Ambroise Francois','Bodoni Moda',serif;\n    font-weight:900;font-style:italic;\n    font-size:96px;line-height:0.82;\n    color:var(--lightning);\n    letter-spacing:0.005em;\n    font-stretch:condensed;\n  }\n  .p-stage{\n    font-family:'JetBrains Mono',monospace;\n    font-size:10px;letter-spacing:0.22em;text-transform:uppercase;\n    color:var(--powder-faint);\n    margin-bottom:10px;\n  }\n  .p-name{\n    font-family:'Elza','Inter',sans-serif;\n    font-weight:600;font-size:38px;line-height:1;\n    margin:0;letter-spacing:-0.015em;\n    color:var(--powder);\n  }\n  .p-body{\n    color:var(--powder-dim);font-size:16px;line-height:1.6;\n  }\n  .p-body b{color:var(--powder);font-weight:600}\n  .p-quote{\n    margin-top:16px;\n    font-family:'Ambroise Francois','Bodoni Moda',serif;\n    font-weight:900;font-style:italic;\n    font-size:22px;line-height:1.2;\n    color:var(--powder);\n    border-left:3px solid var(--lightning);\n    padding:6px 0 6px 16px;\n    text-transform:uppercase;\n    letter-spacing:0.01em;\n    font-stretch:condensed;\n  }\n  @media(max-width:880px){\n    .p-row{grid-template-columns:1fr;gap:18px;padding:36px 0}\n    .p-num{font-size:64px}\n    .p-name{font-size:28px}\n  }\n\n  /* \u2014\u2014\u2014\u2014\u2014 Section 4: Expert's Paradox (powder block) \u2014\u2014\u2014\u2014\u2014 */\n  .paradox{\n    background:var(--powder);\n    color:var(--black-wash);\n    position:relative;\n  }\n  .paradox-strip{\n    height:14px;\n    background:repeating-linear-gradient(90deg,\n      var(--lightning) 0 6px,\n      transparent 6px 16px);\n    border-bottom:1px solid var(--black-wash);\n  }\n  .paradox h2{color:var(--black-wash)}\n  .paradox .body{\n    margin-top:56px;\n    max-width:780px;\n    font-size:21px;line-height:1.55;\n    color:#1a1a1a;\n  }\n  .paradox .body p{margin:0 0 24px}\n  .paradox .body b{color:#000;font-weight:700}\n  .paradox .pull{\n    margin:96px auto 0;\n    max-width:1100px;\n    border-top:1px solid rgba(0,0,0,0.18);\n    border-bottom:1px solid rgba(0,0,0,0.18);\n    padding:64px 0;\n    font-family:'Ambroise Francois','Bodoni Moda',serif;\n    font-weight:900;font-style:italic;\n    font-size:clamp(32px,4.2vw,56px);\n    line-height:1.05;\n    letter-spacing:0.005em;\n    text-transform:uppercase;\n    text-wrap:balance;\n    color:var(--black-wash);\n    font-stretch:condensed;\n  }\n  .pull .hl{\n    background:linear-gradient(180deg, transparent 60%, var(--lightning) 60%);\n    padding:0 6px;\n  }\n  .pull-attr{\n    display:block;margin-top:28px;\n    font-family:'Elza','Inter',sans-serif;font-style:normal;\n    font-size:12p 14 Reveal \u2014\u2014\u2014\u2014\u2014 */\n  .reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease, transform .7s ease}\n  .reveal.in{opacity:1;transform:none}\n\n  @media(max-width:820px){\n    .section-pad{padding:88px 0}\n    .wrap,.wrap-narrow{padding:0 24px}\n    .hero{padding:130px 0 60px}\n  }\n<\/style>\n<\/head>\n<body>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 STICKY NAV \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<nav class=\"nav\" id=\"nav\" data-screen-label=\"Sticky Nav\">\n  <div class=\"nav-inner\">\n    <a class=\"logo\" href=\"#top\" style=\"line-height:0;padding:0;display:flex;align-items:center\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 320 48\" width=\"200\" height=\"30\" style=\"display:block\"><rect width=\"320\" height=\"48\" fill=\"#0D0C0C\" rx=\"3\"/><text x=\"160\" y=\"38\" font-family=\"'Arial Black',Impact,sans-serif\" font-weight=\"900\" font-style=\"italic\" font-size=\"40\" fill=\"#FCFF02\" text-anchor=\"middle\" textLength=\"308\" lengthAdjust=\"spacingAndGlyphs\">UNiGNORABLE<\/text><\/svg><\/a>\n    <div class=\"nav-links\">\n      <a href=\"#problem\">Problem<\/a>\n      <a href=\"#framework\">The 5 P's<\/a>\n      <a href=\"#offer\">The Work<\/a>\n      <a href=\"#invest\">Investment<\/a>\n      <a href=\"#\" class=\"btn\" data-open-apply=\"\" style=\"color: rgb(0, 0, 0)\">Apply \u2192<\/a>\n    <\/div>\n  <\/div>\n<\/nav>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 1. HERO \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<section class=\"hero\" id=\"top\" data-screen-label=\"01 Hero\">\n  <div class=\"hero-glow\"><\/div>\n  <div class=\"beam\"><div class=\"cone\"><\/div><div class=\"ground\"><\/div><\/div>\n\n  <div class=\"wrap hero-inner\">\n    <div class=\"tagstrip eyebrow\">\n      <span class=\"dot\"><\/span>\n      <span>UNIGNORABLE<\/span>\n      <span class=\"sep\">/<\/span>\n      <span>OWNABLE IDEAS AGENCY<\/span>\n      <span class=\"sep\">/<\/span>\n      <span>1-ON-1<\/span>\n      <span class=\"sep\">/<\/span>\n      <span>BY APPLICATION<\/span>\n    <\/div>\n\n    <h1 class=\"h-display\">\n      Don't just share ideas.<br>\n      <span class=\"own\">Own one.<\/span>\n    <\/h1>\n\n    <p class=\"hero-sub\">\n      We help <em>big-brained experts<\/em> extract their first ownable idea \u2014 the one that attracts clients, commands premium prices, and scales beyond you.\n    <\/p>\n\n    <div class=\"hero-cta-row\">\n      <a href=\"#\" class=\"btn btn-lg\" data-open-apply=\"\">\n        Apply to work 1-on-1 <span class=\"arr\">\u2192<\/span>\n      <\/a>\n      <a href=\"#offer\" class=\"btn btn-ghost btn-lg\">See the work<\/a>\n    <\/div>\n\n    <div class=\"hero-meta\">\n      <b>4 client slots<\/b> per month &nbsp;\u00b7&nbsp; $20,000 investment &nbsp;\u00b7&nbsp; No pitch on the call\n    <\/div>\n\n    <div class=\"audience-strip\">\n      <span>FOR <b>CONSULTANTS<\/b><\/span>\n      <span class=\"sep\">/<\/span>\n      <span><b>AGENCY OWNERS<\/b><\/span>\n      <span class=\"sep\">/<\/span>\n      <span><b>COACHES<\/b><\/span>\n      <span class=\"sep\">/<\/span>\n      <span><b>FRACTIONALS<\/b><\/span>\n      <span class=\"sep\">/<\/span>\n      <span>DOING <b>$250K\u2014$2M+<\/b><\/span>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 2. PROBLEM \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<section class=\"section-pad\" id=\"problem\" data-screen-label=\"02 Problem\">\n  <div class=\"wrap\">\n    <div class=\"lead-row reveal\">\n      <div>\n        <div class=\"num\">/ 01 \u2014 THE PROBLEM<\/div>\n        <h2 class=\"h-display\">\n          You're not invisible because you're <em style=\"font-style:italic;color:var(--lightning)\">bad<\/em> at marketing.<br>\n          You're invisible because you haven't found your <em style=\"font-style:italic;color:var(--lightning)\">one idea<\/em> yet.\n        <\/h2>\n      <\/div>\n      <div class=\"right\">\n        You're brilliant. You can out-think 95% of the people in your space. And yet, somehow, you keep getting flattened into a sea of sameness. Here's why.\n      <\/div>\n    <\/div>\n\n    <div class=\"problem-body reveal\">\n      <p>You watch peers half as experienced as you build authority while you stay painfully invisible. They get the speaking gigs. The book deals. The clients who arrive pre-sold.<\/p>\n      <p>It's not that you don't have ideas. <em>You have too many.<\/em> Different ones every Tuesday. Nothing you can plant a flag in.<\/p>\n      <p>People need to <em>buy into your ideas<\/em> before they'll buy from you.<\/p>\n    <\/div>\n\n    <div class=\"problem-grid reveal\">\n      <div>\n        <div class=\"tier\"><span class=\"bar\"><\/span><span>SURFACE<\/span><\/div>\n        <h4>Obscurity.<\/h4>\n        <p>You're brilliant but unknown beyond your own circle. Referrals dry up. Pipeline gets thin. Your income stays fragile because your authority does.<\/p>\n      <\/div>\n      <div>\n        <div class=\"tier\"><span class=\"bar\"><\/span><span>ROOT<\/span><\/div>\n        <h4>The Expert's Paradox.<\/h4>\n        <p>Your depth of expertise blinds you to your own brilliance. And the busier you get with client work, the harder it becomes to work on your own business.<\/p>\n      <\/div>\n      <div>\n        <div class=\"tier\"><span class=\"bar\"><\/span><span>THE BIGGER BATTLE<\/span><\/div>\n        <h4>Commoditization Crisis.<\/h4>\n        <p>AI is making execution skills less rare every day. Being known for what you <em style=\"color:var(--lightning);font-style:normal;font-weight:600\">know<\/em> is becoming the only durable moat.<\/p>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 3. THE 5 P'S \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<section class=\"framework section-pad\" id=\"framework\" data-screen-label=\"03 The 5 Ps\">\n  <div class=\"wrap\">\n    <div class=\"lead-row reveal\">\n      <div>\n        <div class=\"num\">/ 02 \u2014 THE PATH FROM INVISIBLE TO UNIGNORABLE<\/div>\n        <h2 class=\"h-display\">\n          Every expert you admire first became known<br>\n          for <em style=\"font-style:italic;color:var(--lightning)\">one idea.<\/em>\n        <\/h2>\n      <\/div>\n      <div class=\"right\">One idea that became unmistakably theirs and there's a five-stage path to owning it.<\/div>\n    <\/div>\n\n    <div class=\"journey\">\n      <span class=\"pill\">AWARENESS<\/span><span class=\"arr\">\u2192<\/span>\n      <span class=\"pill\">INTEREST<\/span><span class=\"arr\">\u2192<\/span>\n      <span class=\"pill\">CONSIDERATION<\/span><span class=\"arr\">\u2192<\/span>\n      <span class=\"pill\">DESIRE<\/span><span class=\"arr\">\u2192<\/span>\n      <span class=\"pill\">ACTION<\/span>\n    <\/div>\n\n    <div class=\"pees\">\n      <div class=\"p-row reveal\">\n        <div class=\"p-num\">01<\/div>\n        <div>\n          <div class=\"p-stage\">AWARENESS<\/div>\n          <h3 class=\"p-name\">Problem.<\/h3>\n        <\/div>\n        <div class=\"p-body\">\n          <p>You're not invisible because you're bad at marketing. <b>You're invisible because you haven't found your one idea yet.<\/b><\/p>\n          <div class=\"p-quote\">\"People need to buy into your ideas before they'll buy from you.\"<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"p-row reveal\">\n        <div class=\"p-num\">02<\/div>\n        <div>\n          <div class=\"p-stage\">INTEREST<\/div>\n          <h3 class=\"p-name\">POV.<\/h3>\n        <\/div>\n        <div class=\"p-body\">\n          <p>Every expert you admire first became known for <b>one idea<\/b>. Not their skills, not their resume \u2014 one idea that became unmistakably theirs. That's not luck. That's the game.<\/p>\n          <div class=\"p-quote\">\"An ownable idea is an authority shortcut.\"<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"p-row reveal\">\n        <div class=\"p-num\">03<\/div>\n        <div>\n          <div class=\"p-stage\">CONSIDERATION<\/div>\n          <h3 class=\"p-name\">Product.<\/h3>\n        <\/div>\n        <div class=\"p-body\">\n          <p>We're the <b>Ownable Ideas agency.<\/b> We'll help you claim your first ownable idea. One that attracts clients, commands premium prices, and scales beyond you.<\/p>\n          <div class=\"p-quote\">\"Don't just share ideas. Own one.\"<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"p-row reveal\">\n        <div class=\"p-num\">04<\/div>\n        <div>\n          <div class=\"p-stage\">DESIRE<\/div>\n          <h3 class=\"p-name\">Promise.<\/h3>\n        <\/div>\n        <div class=\"p-body\">\n          <p>Get it right, and <b>everything changes.<\/b> Clients come to you. Content stops being a chore. You finally have the leverage to scale.<\/p>\n          <div class=\"p-quote\">\"Idea owners get rich.\"<\/div>\n        <\/div>\n      <\/div>\n      <div class=\"p-row reveal\">\n        <div class=\"p-num\">05<\/div>\n        <div>\n          <div class=\"p-stage\">ACTION<\/div>\n          <h3 class=\"p-name\">Proof.<\/h3>\n        <\/div>\n        <div class=\"p-body\">\n          <p>I went from bankrupt startup founder to <b>7-figure solopreneur<\/b> (and new mom). All because I committed to my first ownable idea. And I've helped many others do it too.<\/p>\n          <div class=\"p-quote\">\"Every expert you can think of has an ownable idea. That's not a coincidence.\"<\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 4. EXPERT'S PARADOX (paper block) \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n\n<section class=\"paradox section-pad\" data-screen-label=\"04 Experts Paradox\">\n  <div class=\"wrap-narrow\">\n    <div class=\"mono reveal\" style=\"color:#555;font-size:12px;letter-spacing:0.18em;margin-bottom:24px\">/ 03 \u2014 THE EXPERT'S PARADOX<\/div>\n    <h2 class=\"h-display reveal\" style=\"font-size:clamp(40px,5.6vw,84px)\">\n      You're too close to<br>\n      your own brilliance<br>\n      to find your idea alone.\n    <\/h2>\n\n    <div class=\"body reveal\">\n      <p>Experts don't get known for being good. <b>They get known for the one idea they own.<\/b> But your depth of expertise is also your blind spot.<\/p>\n      <p>What looks obvious to you sounds like jargon to your market. What feels generic to you is exactly what your buyer is desperate to hear. You can't read the label from inside the bottle.<\/p>\n      <p>And every hour you spend doing client work is an hour you're not building your own authority. The busier you get, the deeper you sink. That's the paradox \u2014 and it's why almost nobody escapes it alone.<\/p>\n    <\/div>\n\n    <div class=\"pull reveal\">\n      \"Every expert you can think of has an <span class=\"hl\">ownable idea.<\/span> That's not a coincidence.\"\n      <span class=\"pull-attr\">\u2014 The thesis behind UNIGNORABLE<\/span>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 5. THE WORK \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<section class=\"section-pad\" id=\"offer\" data-screen-label=\"05 The Work\">\n  <div class=\"wrap\">\n    <div class=\"lead-row reveal\">\n      <div>\n        <div class=\"num\">/ 04 \u2014 WHAT WE DO TOGETHER<\/div>\n        <h2 class=\"h-display\">\n          90 days. 1-on-1.<br>\n          Three phases. <em style=\"color:var(--lightning);font-style:italic\">One ownable idea<\/em><br>\n          you'll build a career on.\n        <\/h2>\n      <\/div>\n      <div class=\"right\">No cohort or no group calls where you compete for airtime. This is a thought-sparring partnership \u2014 you and Katelyn, working the problem until it's solved.<\/div>\n    <\/div>\n\n    <div class=\"phases\">\n      <div class=\"phase reveal\">\n        <div class=\"phase-num\">01<\/div>\n        <div>\n          <div class=\"phase-meta\">EXTRACT &nbsp;\u00b7&nbsp; WEEKS 01\u201404<\/div>\n          <h3 class=\"phase-name\">Pull the idea out of your head.<\/h3>\n          <p class=\"phase-body\">\n            We dig into the idea already living in your head. Through deep working sessions, we surface <b>your central argument<\/b> \u2014 the thing you foundationally believe that almost nobody else is saying out loud. We map your wins, your battle scars, and your unique lens. This is the raw material everything gets built from.\n          <\/p>\n        <\/div>\n      <\/div>\n      <div class=\"phase reveal\">\n        <div class=\"phase-num\">02<\/div>\n        <div>\n          <div class=\"phase-meta\">SHAPE &nbsp;\u00b7&nbsp; WEEKS 05\u201408<\/div>\n          <h3 class=\"phase-name\">Sharpen it against the market.<\/h3>\n          <p class=\"phase-body\">\n            We pressure-test your argument against what's actually being said out there. What macro trends can you ride? What does your buyer need to hear that nobody is telling them? We compress your idea into language that's <b>sticky, spreadable, and impossible to ignore<\/b>. You walk away with a complete messaging document and a brand narrative built around your idea.\n          <\/p>\n        <\/div>\n      <\/div>\n      <div class=\"phase reveal\">\n        <div class=\"phase-num\">03<\/div>\n        <div>\n          <div class=\"phase-meta\">ACTIVATE &nbsp;\u00b7&nbsp; WEEKS 09\u201412<\/div>\n          <h3 class=\"phase-name\">Plant the flag in the market.<\/h3>\n          <p class=\"phase-body\">\n            We don't hand you a beautiful PDF and disappear. We build the launchpad. <b>LinkedIn profile makeover. Content strategy. Production systems<\/b> that let you (or a ghostwriter) keep shipping content that compounds. The idea has to actually leave your head and enter the market. That's the whole point.\n          <\/p>\n        <\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"deliverables reveal\">\n      <h4>What you walk away with \u2014<\/h4>\n      <ul class=\"deliv-grid\">\n        <li><span class=\"ck\">\u2713<\/span><div>Your <b>ownable idea<\/b>, codified into a central argument<\/div><\/li>\n        <li><span class=\"ck\">\u2713<\/span><div>A complete messaging document \u2014 narrative, POV, hooks, the 5 P's<\/div><\/li>\n        <li><span class=\"ck\">\u2713<\/span><div>Profile &amp; bio rewrites for LinkedIn and your website<\/div><\/li>\n        <li><span class=\"ck\">\u2713<\/span><div>A 90-day content strategy built around your idea<\/div><\/li>\n        <li><span class=\"ck\">\u2713<\/span><div>Production systems &amp; templates to keep shipping without burning out<\/div><\/li>\n        <li><span class=\"ck\">\u2713<\/span><div>A bridge message that wins clients now AND launches your bigger vision<\/div><\/li>\n      <\/ul>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 DIFFERENTIATION CALLOUT \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<section class=\"section-pad\" style=\"padding-top:0\" data-screen-label=\"06 Differentiation\">\n  <div class=\"wrap\">\n    <div class=\"diff reveal\">\n      <div>\n        <div class=\"label\">THE DIFFERENCE<\/div>\n        <h3>The only ownable ideas agency in the world.<\/h3>\n      <\/div>\n      <div class=\"body\">\n        Other marketing and content agencies help you <b>shout louder.<\/b> We give you something <b>worth shouting about.<\/b><br><br>\n        UNIGNORABLE sits at the intersection of positioning, messaging, and personal brand. We don't write your content. We don't run your ads. We extract the central argument that makes everything else work \u2014 the one your buyer can't get from your competitors, and can't get from ChatGPT either.\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 7. FOR / NOT FOR \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<section class=\"section-pad\" id=\"forwho\" data-screen-label=\"07 For Whom\">\n  <div class=\"wrap\">\n    <div class=\"lead-row reveal\">\n      <div>\n        <div class=\"num\">/ 05 \u2014 WHO THIS IS FOR<\/div>\n        <h2 class=\"h-display\">\n          For <em style=\"color:var(--lightning);font-style:italic\">big-brained experts<\/em><br>\n          in transition.\n        <\/h2>\n      <\/div>\n      <div class=\"right\">\n        Consultants, agency owners, coaches, fractionals \u2014 doing $250K\u2013$2M+. You want more optionality in your business. You're watching peers build authority while you stay invisible. The work is too deep for the wrong fit \u2014 for you or me.\n      <\/div>\n    <\/div>\n\n    <div class=\"forwho-grid reveal\">\n      <div class=\"forwho-col yes\">\n        <div class=\"sub\">/ Sign me up<\/div>\n        <h3>This is for you if \u2014<\/h3>\n        <ul>\n          <li><span class=\"mark\">\u2713<\/span><div>You're a consultant, advisor, agency owner, coach, or fractional whose business runs on your expertise.<\/div><\/li>\n          <li><span class=\"mark\">\u2713<\/span><div>You're doing $250K\u2013$2M+ and want more optionality \u2014 a book, a keynote, productized offers, a real thought leadership engine.<\/div><\/li>\n          <li><span class=\"mark\">\u2713<\/span><div>You've built something real \u2014 wins, case studies, paying clients \u2014 but you're getting lost in a sea of sameness.<\/div><\/li>\n          <li><span class=\"mark\">\u2713<\/span><div>You're willing to think in public and put a stake in the ground.<\/div><\/li>\n          <li><span class=\"mark\">\u2713<\/span><div>You'd rather pay for one human who'll go deep than a cohort, course, or AI tool that goes wide.<\/div><\/li>\n        <\/ul>\n      <\/div>\n      <div class=\"forwho-col no\">\n        <div class=\"sub\">/ Pass<\/div>\n        <h3>This isn't for you if \u2014<\/h3>\n        <ul>\n          <li><span class=\"mark\">\u2715<\/span><div>You're pre-revenue or haven't done the work yet to have a real point of view.<\/div><\/li>\n          <li><span class=\"mark\">\u2715<\/span><div>You want someone to hand you a \"personal brand\" with no input from you.<\/div><\/li>\n          <li><span class=\"mark\">\u2715<\/span><div>You're looking for a content agency to ghostwrite for you forever.<\/div><\/li>\n          <li><span class=\"mark\">\u2715<\/span><div>You want fast hacks instead of a strategic foundation.<\/div><\/li>\n          <li><span class=\"mark\">\u2715<\/span><div>You're not ready to commit to 90 days of real thinking.<\/div><\/li>\n        <\/ul>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 8. MEET KATELYN \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<section class=\"section-pad\" id=\"meet\" data-screen-label=\"08 Meet Katelyn\">\n  <div class=\"wrap\">\n    <div class=\"meet\">\n      <div class=\"meet-photo reveal\" aria-hidden=\"true\">\n        <img src=\"https://cdn.prod.website-files.com/5ca4efffd7cf6e732e4e4fb1/63addd09b966f524f0a6f147_katelyn-yellow.jpeg\" alt=\"Katelyn Bourgoin\" style=\"width:100%;height:100%;object-fit:cover;object-position:center top;\">\n      <\/div>\n      <div class=\"reveal\">\n        <div class=\"mono\" style=\"color:var(--lightning);font-size:12px;letter-spacing:0.18em;margin-bottom:20px\">/ 06 \u2014 MEET KATELYN<\/div>\n        <h2 class=\"h-display\">\n          I went from <em style=\"color:var(--lightning);font-style:italic\">bankrupt<\/em><br>\n          to <em style=\"color:var(--lightning);font-style:italic\">7-figure<\/em> on the back<br>\n          of one ownable idea.\n        <\/h2>\n        <div class=\"meet-body\" style=\"margin-top:36px\">\n          <p>From going bankrupt building a VC-backed startup to building a <b>7-figure creator business<\/b> as a solopreneur and new mom \u2014 all by owning one idea: <span class=\"accent\">buyer psychology.<\/span><\/p>\n          <p>I've spent the last decade obsessed with what makes ideas spread. I've written a newsletter <b>Forbes called a must-read for marketers<\/b>, sold out launches in under six minutes, and helped clients turn vague expertise into the kind of authority that pre-sells them on every call.<\/p>\n          <p>The entrepreneurs who win from here aren't the ones with the most expertise. They're the ones willing to <b>own an idea and become the face of it<\/b>. That's harder than it sounds. Almost impossible alone.<\/p>\n          <p>That's what I do. Pull the idea out of your head. Shape it. Get it ready to leave the launchpad.<\/p>\n        <\/div>\n\n        <div class=\"credibility\">\n          <span class=\"lbl\">As featured in \u2014<\/span>\n          <span class=\"logo-text\">Forbes<\/span>\n          <span class=\"logo-text\">SparkToro<\/span>\n          <span class=\"logo-text\">Demand Curve<\/span>\n          <span class=\"logo-text\">Creator Science<\/span>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 9. INVESTMENT \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<section class=\"investment section-pad\" id=\"invest\" data-screen-label=\"09 Investment\">\n  <div class=\"beam\"><div class=\"cone\"><\/div><div class=\"ground\"><\/div><\/div>\n  <div class=\"wrap\">\n    <div class=\"invest-card reveal\">\n      <span class=\"tag\">THE INVESTMENT<\/span>\n      <div class=\"price\"><span class=\"c\">$<\/span>20,000<\/div>\n      <div class=\"terms\">\n        <span>90 DAYS<\/span><span class=\"sep\">\u00b7<\/span>\n        <span>1-ON-1<\/span><span class=\"sep\">\u00b7<\/span>\n        <span>BY APPLICATION<\/span>\n      <\/div>\n      <p class=\"copy\">We work with 4 clients per month.&nbsp;This isn't a course you binge in a weekend or a cohort you get lost in. It's a thought-sparring partnership for people who are serious about building authority that lasts.<\/p>\n      <p class=\"copy\" style=\"font-style:italic;color:#444\">If you're the right fit, this is the highest-leverage $20K you'll spend in your business this year.<\/p>\n      <a href=\"#\" class=\"btn btn-lg\" data-open-apply=\"\">Apply to work with Katelyn <span class=\"arr\">\u2192<\/span><\/a>\n      <div class=\"fine\">30-minute fit call. No pitching. If it's not a match, I'll point you to someone better.<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 10. STAKES (manifesto close) \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<section class=\"stakes\" data-screen-label=\"10 Stakes\">\n  <div class=\"wrap\">\n    <div class=\"mono reveal\" style=\"color:var(--powder-faint);font-size:13px;letter-spacing:0.18em;margin-bottom:32px\">/ 07 \u2014 THE STAKES<\/div>\n    <h2 class=\"h-display reveal\">\n      <span class=\"w\">Idea owners<\/span><br>\n      get rich.<br>\n      <span class=\"w\" style=\"font-style:italic\">The rest get<\/span><br>\n      <span class=\"w\" style=\"font-style:italic\">forgotten.<\/span>\n    <\/h2>\n\n    <div class=\"stakes-body reveal\">\n      <p>Every month you stay scattered, someone else with half your talent is owning the territory that should be yours. They're writing the book. Getting the keynote. Charging the premium. Becoming <em>the obvious answer<\/em> when someone asks, \"Who do you know who\u2026?\"<\/p>\n      <p>You don't need more expertise. You have plenty.<\/p>\n      <p>You need an idea you can plant a flag in. One that pre-sells clients on working with you. One that spreads while you sleep. One that turns you from <em>\"another good consultant\"<\/em> into the expert everyone copies.<\/p>\n      <p>That's what we'll build together.<\/p>\n    <\/div>\n\n    <div class=\"stakes-cta reveal\">\n      <a href=\"#\" class=\"btn btn-lg\" data-open-apply=\"\">Become unignorable <span class=\"arr\">\u2192<\/span><\/a>\n      <span class=\"fine\">4 client slots per month. Apply now to claim yours.<\/span>\n    <\/div>\n  <\/div>\n<\/section>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 FOOTER \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<footer>\n  <div class=\"wrap foot-inner\">\n    <div>\n      <div class=\"foot-logo\" style=\"line-height:0\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 520 88\" width=\"380\" height=\"64\" style=\"display:block\"><rect width=\"520\" height=\"88\" fill=\"#0D0C0C\" rx=\"4\"/><text x=\"260\" y=\"70\" font-family=\"'Arial Black',Impact,sans-serif\" font-weight=\"900\" font-style=\"italic\" font-size=\"72\" fill=\"#FCFF02\" text-anchor=\"middle\" textLength=\"506\" lengthAdjust=\"spacingAndGlyphs\">UNiGNORABLE<\/text><\/svg><\/div>\n      <div style=\"margin-top:10px\">\u00a9 2026 Katelyn Bourgoin. The Ownable Ideas Agency.<\/div>\n    <\/div>\n    <div class=\"foot-links\">\n      <a href=\"#problem\">Problem<\/a>\n      <a href=\"#framework\">The 5 P's<\/a>\n      <a href=\"#offer\">The Work<\/a>\n      <a href=\"#invest\">Invest<\/a>\n      <a href=\"#\" data-open-apply=\"\">Apply<\/a>\n    <\/div>\n  <\/div>\n<\/footer>\n\n<!-- \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 MODAL \u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014\u2014 -->\n<div class=\"modal-bg\" id=\"modal\">\n  <div class=\"modal\" role=\"dialog\" aria-label=\"Apply\">\n    <button class=\"modal-close\" id=\"modalClose\" aria-label=\"Close\">\u2715<\/button>\n    <div id=\"modalForm\">\n      <div class=\"mono\" style=\"color:#666;font-size:11px;letter-spacing:0.20em;margin-bottom:14px\">/ APPLICATION \u00b7 1-ON-1<\/div>\n      <h3>Tell me about the idea<br>in your head.<\/h3>\n      <p class=\"sub\">Five questions. ~3 minutes. If it's a fit, I'll send you a Calendly link within 48 hours.<\/p>\n\n      <form id=\"applyForm\" onsubmit=\"return submitApply(event)\">\n        <div class=\"field\">\n          <label>Your name<\/label>\n          <input required=\"\" name=\"name\" type=\"text\" placeholder=\"First and last\">\n        <\/div>\n        <div class=\"field\">\n          <label>What you do (the business)<\/label>\n          <input required=\"\" name=\"biz\" type=\"text\" placeholder=\"e.g. Independent CRO consultant for B2B SaaS\">\n        <\/div>\n        <div class=\"field\">\n          <label>Current annual revenue range<\/label>\n          <select required=\"\" name=\"rev\">\n            <option value=\"\">Select a range<\/option>\n            <option>Under $250K<\/option>\n            <option>$250K \u2014 $500K<\/option>\n            <option>$500K \u2014 $1M<\/option>\n            <option>$1M \u2014 $2M<\/option>\n            <option>$2M+<\/option>\n          <\/select>\n        <\/div>\n        <div class=\"field\">\n          <label>What do you want to be known for?<\/label>\n          <textarea required=\"\" name=\"known\" placeholder=\"A sentence is fine. Vague is fine. We'll sharpen it together.\"><\/textarea>\n        <\/div>\n        <div class=\"field\">\n          <label>Why now?<\/label>\n          <textarea required=\"\" name=\"why\" placeholder=\"What's the thing that made you fill this out today?\"><\/textarea>\n        <\/div>\n        <button type=\"submit\" class=\"btn btn-lg\">Submit application <span class=\"arr\">\u2192<\/span><\/button>\n      <\/form>\n    <\/div>\n    <div id=\"modalSuccess\" class=\"modal-success\" style=\"display:none\">\n      <div class=\"ck-big\">\u2713<\/div>\n      <h3>Got it.<\/h3>\n      <p class=\"sub\" style=\"margin-top:8px\">I read every application personally. If it's a fit, you'll hear from me within 48 hours.<\/p>\n    <\/div>\n  <\/div>\n<\/div>\n\n<script>\n  // Sticky nav\n  const nav = document.getElementById('nav');\n  window.addEventListener('scroll', () => {\n    if (window.scrollY > 400) nav.classList.add('show');\n    else nav.classList.remove('show');\n  });\n\n  // Reveal on scroll\n  const io = new IntersectionObserver((entries) => {\n    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }});\n  }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });\n  document.querySelectorAll('.reveal').forEach(el => io.observe(el));\n\n  // Modal\n  const modal = document.getElementById('modal');\n  const modalClose = document.getElementById('modalClose');\n  document.querySelectorAll('[data-open-apply]').forEach(el => {\n    el.addEventListener('click', (e) => { e.preventDefault(); modal.classList.add('show'); document.body.style.overflow='hidden'; });\n  });\n  function closeModal(){ modal.classList.remove('show'); document.body.style.overflow=''; }\n  modalClose.addEventListener('click', closeModal);\n  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });\n  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });\n\n  function submitApply(e){\n    e.preventDefault();\n    document.getElementById('modalForm').style.display = 'none';\n    document.getElementById('modalSuccess').style.display = 'block';\n    setTimeout(() => {\n      closeModal();\n      setTimeout(() => {\n        document.getElementById('modalForm').style.display = '';\n        document.getElementById('modalSuccess').style.display = 'none';\n        document.getElementById('applyForm').reset();\n      }, 400);\n    }, 2200);\n    return false;\n  }\n<\/script>\n\n\n\n<\/body><\/html>"</script>
